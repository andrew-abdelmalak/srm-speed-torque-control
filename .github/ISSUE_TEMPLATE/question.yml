name: Question
description: Ask about the 6/4 SRM equations, cubic TSF, Simulink model, or Python validation.
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: Link the relevant file, equation, or figure when possible.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you already checked?
      description: Note which sections of README.md or docs/SRM_Speed_Torque_Control_Paper.pdf you read.
