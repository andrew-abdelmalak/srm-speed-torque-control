<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">SRM Speed and Torque Control</title>
  <desc id="desc">Cascaded 6/4 switched reluctance motor drive with cubic torque sharing in MATLAB/Simulink and Python.</desc>

  <rect width="1280" height="640" fill="#0F172A"/>
  <rect x="0" y="0" width="16" height="640" fill="#38BDF8"/>

  <!-- Geometric 6/4 SRM stator/rotor emblem on the right -->
  <g transform="translate(1030, 265)" opacity="0.92">
    <circle cx="0" cy="0" r="142" fill="none" stroke="#1E293B" stroke-width="26"/>
    <circle cx="0" cy="0" r="142" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
    <!-- 6 stator poles -->
    <rect x="-14" y="-128" width="28" height="40" rx="4" fill="#38BDF8"/>
    <rect x="-14" y="88" width="28" height="40" rx="4" fill="#38BDF8"/>
    <rect x="-14" y="-128" width="28" height="40" rx="4" fill="#1D4ED8" transform="rotate(60)"/>
    <rect x="-14" y="88" width="28" height="40" rx="4" fill="#1D4ED8" transform="rotate(60)"/>
    <rect x="-14" y="-128" width="28" height="40" rx="4" fill="#0284C7" transform="rotate(120)"/>
    <rect x="-14" y="88" width="28" height="40" rx="4" fill="#0284C7" transform="rotate(120)"/>
    <!-- 4 rotor poles -->
    <rect x="-13" y="-76" width="26" height="152" rx="6" fill="#F97316" transform="rotate(25)"/>
    <rect x="-13" y="-76" width="26" height="152" rx="6" fill="#F97316" transform="rotate(115)"/>
    <circle cx="0" cy="0" r="32" fill="#0F172A" stroke="#F8FAFC" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#38BDF8"/>
  </g>

  <!-- Badge pill -->
  <rect x="80" y="96" width="262" height="46" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="211" y="126" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" font-weight="600" fill="#38BDF8">6/4 SRM · CUBIC TSF</text>

  <!-- Title -->
  <text font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="76" font-weight="800" fill="#F8FAFC">
    <tspan x="80" y="246">SRM Speed &amp; Torque</tspan>
    <tspan x="80" y="334">Control</tspan>
  </text>

  <!-- Tagline -->
  <text font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="36" font-weight="400" fill="#CBD5E1">
    <tspan x="80" y="420">Cascaded PI, cubic TSF, and hysteresis</tspan>
    <tspan x="80" y="468">drive in MATLAB/Simulink and Python</tspan>
  </text>

  <!-- Footer mark -->
  <text x="80" y="556"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" fill="#38BDF8">github.com/andrew-abdelmalak/srm-speed-torque-control</text>
</svg>
