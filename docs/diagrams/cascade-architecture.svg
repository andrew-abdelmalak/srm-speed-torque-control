<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-labelledby="title desc">
  <title id="title">6/4 SRM Cascaded Speed and Torque Control Architecture</title>
  <desc id="desc">Block diagram showing the speed summing junction, PI speed regulator, cubic torque sharing function, nonlinear torque-to-current inversion, hysteresis current controller with asymmetric half-bridge converter, and 6/4 SRM plant with speed, position, and phase-current feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="270" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Reference input -->
  <text x="12" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">ω* (rad/s)</text>
  <line x1="18" y1="98" x2="72" y2="98" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Summing junction -->
  <circle cx="92" cy="98" r="16" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
  <text x="92" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Σ</text>
  <text x="67" y="90" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#475569">+</text>
  <text x="80" y="126" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" fill="#475569">−</text>

  <!-- PI Speed -->
  <line x1="108" y1="98" x2="136" y2="98" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="140" y="60" width="124" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="202" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">PI Speed</text>
  <text x="202" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">Kp=0.5, Ki=10</text>
  <text x="202" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">Clamp 0..5 N·m</text>

  <!-- T* to Cubic TSF -->
  <line x1="264" y1="98" x2="298" y2="98" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="281" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">T*</text>
  <rect x="302" y="60" width="124" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="364" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">Cubic TSF</text>
  <text x="364" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">f(x) = 3x² − 2x³</text>
  <text x="364" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">θov = 10°</text>

  <!-- Tk* to T2I -->
  <line x1="426" y1="98" x2="462" y2="98" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="444" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Tk*</text>
  <rect x="466" y="60" width="132" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="532" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">T2I Inversion</text>
  <text x="532" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">√(2 Tk* / dL/dθ)</text>
  <text x="532" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">Imax = 15 A</text>

  <!-- ik* to Hysteresis + AHB -->
  <line x1="598" y1="98" x2="634" y2="98" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="616" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">ik*</text>
  <rect x="638" y="60" width="136" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="706" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">Hysteresis + AHB</text>
  <text x="706" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">Band ±0.1 A</text>
  <text x="706" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#334155">±300 V / 0 V</text>

  <!-- vk to SRM Plant -->
  <line x1="774" y1="98" x2="808" y2="98" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="791" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">vk</text>
  <rect x="812" y="60" width="124" height="76" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="874" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#9A3412">6/4 SRM Plant</text>
  <text x="874" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#431407">L(θ): 20..150 mH</text>
  <text x="874" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#431407">Ts = 10 µs</text>

  <!-- Rotor position taps -->
  <path d="M 874 136 L 874 176 L 364 176 L 364 140" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-muted)"/>
  <path d="M 532 176 L 532 140" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-muted)"/>
  <circle cx="532" cy="176" r="3" fill="#64748B"/>
  <text x="615" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#475569">Rotor position θ</text>

  <!-- Current feedback tap -->
  <path d="M 845 136 L 845 204 L 706 204 L 706 140" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-muted)"/>
  <text x="776" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" fill="#475569">Phase currents ik</text>

  <!-- Speed feedback loop -->
  <path d="M 902 136 L 902 234 L 92 234 L 92 118" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="495" y="226" text-anchor="middle" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Measured speed ω (rad/s)</text>
</svg>
